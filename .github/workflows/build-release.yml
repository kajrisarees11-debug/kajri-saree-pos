name: Build & Publish Windows App

# Builds the Electron desktop app on every push to main that touches
# desktop-relevant files, and publishes the installer to a fresh GitHub
# Release each time. The installer filename itself never changes
# ("Kajri.POS.Setup.exe"), so the site's "Download for Windows" link (which
# points at that fixed filename via /releases/latest/download/) always
# serves the newest build without anyone needing to edit a link by hand.
#
# Each build gets a genuinely unique, increasing version
# (1.0.<run number>) via --config.extraMetadata.version below, without
# touching the checked-in package.json version — this is what lets the
# in-app auto-updater (electron-updater) actually detect that a newer
# build exists. Without a real version bump per release, every install
# would look identical to the updater and it would never offer an update.
# (Uses the long --config flag rather than the -c alias — on the CI
# runner, npx's own -c/--call flag collided with it.)
#
# The version tag (vX.Y.Z) is created and pushed BEFORE calling
# electron-builder — GitHub's API rejects creating a published (non-draft)
# release for a tag that doesn't exist yet ("Published releases must have
# a valid tag"); it only auto-creates the tag for draft releases. Creating
# the tag ourselves first sidesteps that.
env:
  APP_VERSION: 1.0.${{ github.run_number }}

on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "jsconfig.json"
      - ".github/workflows/build-release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Create release tag
        run: |
          git tag -f v${{ env.APP_VERSION }}
          git push origin v${{ env.APP_VERSION }} -f

      - name: Build and publish Windows installer
        run: npx electron-builder build --win --publish always --config.extraMetadata.version=${{ env.APP_VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
