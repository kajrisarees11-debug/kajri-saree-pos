name: Build & Publish Windows App

# Builds the Electron desktop app on every push to main that touches
# desktop-relevant files, and publishes the installer to this repo's GitHub
# Release — overwriting the existing "Kajri.POS.Setup.exe" asset in place so
# the site's "Download for Windows" link (which points at that fixed
# filename via /releases/latest/download/) always serves the newest build
# without anyone needing to edit a link or upload a file by hand.
on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - ".github/workflows/build-release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Build and publish Windows installer
        run: npx electron-builder build --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
