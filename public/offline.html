<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kajri POS – Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0a0d;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 80px; height: 80px;
      background: #8B1A4A;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 900;
      color: #d4af37;
      font-family: Georgia, serif;
      margin-bottom: 8px;
      box-shadow: 0 8px 32px rgba(139,26,74,0.5);
    }
    h1 { font-size: 22px; font-weight: 700; }
    p { font-size: 14px; color: #aaa; max-width: 320px; line-height: 1.6; }
    .status {
      display: flex; align-items: center; gap: 8px;
      background: #1e1218;
      border: 1px solid #8B1A4A44;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 13px;
      color: #f59e0b;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    button {
      background: #8B1A4A; color: white; border: none;
      padding: 12px 28px; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    button:hover { background: #a82060; }
    .hint { font-size: 12px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="logo">K</div>
  <h1>Kajri POS</h1>
  <p>You are offline and the app has not been loaded in this browser yet. Please connect to the internet once — after that the app will work offline automatically.</p>
  <div class="status"><div class="dot"></div>Waiting for internet connection…</div>
  <button onclick="window.location.reload()">🔄 Try Again</button>
  <p class="hint">Once loaded online, all billing data is cached locally and accessible offline.</p>
  <script>
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
